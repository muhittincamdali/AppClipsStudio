# XcodeGen spec for CoffeeShop.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: CoffeeShop
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  AppClipsStudio:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # The simulator needs no team; set DEVELOPMENT_TEAM to run on a device.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  CoffeeShop:
    type: application
    platform: iOS
    sources: [Shared, CoffeeShop]
    dependencies:
      - package: AppClipsStudio
        product: AppClipsStudio
      - target: CoffeeShopClip
    entitlements:
      path: CoffeeShop/CoffeeShop.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:example.com
          - applinks:appclip.example.com
        com.apple.security.application-groups:
          - group.io.github.muhittincamdali.CoffeeShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.CoffeeShop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coffee Shop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  CoffeeShopClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Shared, CoffeeShopClip]
    dependencies:
      - package: AppClipsStudio
        product: AppClipsStudio
    info:
      path: CoffeeShopClip/Info.plist
      properties:
        CFBundleDisplayName: Coffee Shop
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: true
    entitlements:
      path: CoffeeShopClip/CoffeeShopClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)io.github.muhittincamdali.CoffeeShop
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.associated-domains:
          - appclips:example.com
          - appclips:appclip.example.com
        com.apple.security.application-groups:
          - group.io.github.muhittincamdali.CoffeeShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.CoffeeShop.Clip
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPCLIP
schemes:
  CoffeeShop:
    build:
      targets:
        CoffeeShop: all
    run:
      config: Debug
  CoffeeShopClip:
    build:
      targets:
        CoffeeShopClip: all
    run:
      config: Debug
      environmentVariables:
        _XCAppClipURL: https://appclip.example.com/table/12?p=1
